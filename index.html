<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armandt Erasmus | Portfolio</title>
    <meta name="google" content="notranslate">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .center-text {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .name {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px 30px;
            font-size: 1.2rem;
        }

        .links a {
            text-decoration: none;
            color: #333;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: #878787;
        }

        .actuarial-edge-link {
            display: inline-flex;
            align-items: center;
            transition: opacity 0.2s ease;
        }

        .actuarial-edge-link img {
            display: block;
            height: 36px;
            width: auto;
            max-width: 100%;
        }

        .actuarial-edge-link:hover {
            opacity: 0.7;
        }

        .actuarial-edge-link {
            flex-basis: 100%;
            justify-content: center;
            margin-top: 8px;
        }
        
        .actuarial-edge-link img {
            border-radius: 8px;
        }

        
    </style>
</head>
<body>
    <div class="center-text">
        <div class="name">Armandt Erasmus</div>

        <div class="links">
            <a
                href="https://www.linkedin.com/in/armandterasmus/"
                target="_blank"
                rel="noopener noreferrer"
            >LinkedIn</a>

            <a
                href="extras/Armandt_Erasmus_Resume.pdf"
                target="_blank"
                rel="noopener noreferrer"
            >Resume</a>

            <a
                href="https://github.com/ArmandtErasmus"
                target="_blank"
                rel="noopener noreferrer"
            >GitHub</a>

            <a href="projects/projects.html">Projects</a>

            <a
                href="https://www.theactuarialedge.com/"
                class="actuarial-edge-link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img
                    src="extras/actuarial-edge-logo.png"
                    alt="The Actuarial Edge"
                >
                <span>The Actuarial Edge</span>
            </a>
        </div>
    </div>
</body>
</html>
